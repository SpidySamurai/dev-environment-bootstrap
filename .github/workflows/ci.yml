name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Pinned so a runner image update cannot change the result.
      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      # config/zsh/ holds zsh files, which ShellCheck does not support.
      - name: Lint shell scripts
        run: |
          shellcheck --version
          shellcheck install.sh bootstrap.sh lib/*.sh tests/*.sh \
            tests/fixtures/mock-bin/npm tests/fixtures/node-prefix/bin/node

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run the test suite
        run: ./tests/run.sh
